# =============================================================================
# CWT Tmux Configuration
# =============================================================================

# Enable mouse support (scroll, click, resize)
set -g mouse on

# Pass scroll to applications (fixes Claude Code scroll in tmux)
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

# Increase scrollback buffer
set -g history-limit 50000

# Better colors
set -g default-terminal "screen-256color"

# Status bar style
set -g status-style 'bg=#333333 fg=#ffffff'
set -g status-left '#[fg=green][#S] '
set -g status-right '#[fg=yellow]%H:%M '
set -g status-left-length 20

# Window status
setw -g window-status-current-style 'fg=black bg=green bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

# Faster key repetition
set -s escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 0
setw -g pane-base-index 0

# Reload config with prefix + r
bind r source-file ~/.config/cwt/tmux.conf \; display "Config reloaded"

# Easy window navigation
bind -n M-Left select-window -p
bind -n M-Right select-window -n

# Copy mode improvements (vim-like)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
